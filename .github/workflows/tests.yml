name: Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to test (default: the commit that triggered the workflow)'
        type: string
        default: ''

jobs:
  lint:
    name: PHPCS (security and PHP compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer lint

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}${{ matrix.multisite && ', multisite' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.3', '8.4', '8.5' ]
        multisite: [ false ]
        include:
          - php: '8.3'
            multisite: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npx wp-env start
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
      - run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/inline-gdocs-viewer bash -c "WP_MULTISITE=${{ matrix.multisite && '1' || '0' }} vendor/bin/phpunit"

  phpunit-74:
    # The wp-env image for PHP 7.4 no longer builds, so run PHP 7.4 in a
    # plain php:7.4-cli container against wp-env's test database and files.
    name: PHPUnit (PHP 7.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npx wp-env start
      - name: Run PHPUnit in php:7.4-cli
        run: |
          home=$(npx wp-env install-path | tail -1)
          cli=$(docker ps --format '{{.Names}}' | grep tests-cli | head -1)
          network=$(docker inspect "$cli" --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          docker run --rm --network "$network" \
            -v "$home/tests-WordPress-PHPUnit/tests/phpunit:/wordpress-phpunit" \
            -v "$home/tests-WordPress:/var/www/html" \
            -v "$PWD:/var/www/html/wp-content/plugins/inline-gdocs-viewer" \
            -e WP_TESTS_DIR=/wordpress-phpunit -e WORDPRESS_DB_HOST=tests-mysql \
            -e WORDPRESS_DB_USER=root -e WORDPRESS_DB_PASSWORD=password -e WORDPRESS_DB_NAME=tests-wordpress \
            -w /var/www/html/wp-content/plugins/inline-gdocs-viewer \
            php:7.4-cli sh -c 'docker-php-ext-install mysqli > /dev/null && vendor/bin/phpunit'

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx wp-env start
      - run: npm run test:e2e
