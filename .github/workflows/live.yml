name: Live tests

# Runs the browser tests against real Google resources and files on GitHub
# (tests/e2e/live-google.spec.js), weekly and on demand. The resources come
# from repository variables (Settings > Secrets and variables > Actions >
# Variables): IGSV_LIVE_SHEET, IGSV_LIVE_PRIVATE_SHEET, IGSV_LIVE_WEBAPP.
# A failure usually means Google changed one of its services, or a resource
# was changed or unshared; see "Live tests" in README.md.

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live tests (Google and GitHub)
    runs-on: ubuntu-latest
    env:
      IGSV_LIVE_SHEET: ${{ vars.IGSV_LIVE_SHEET }}
      IGSV_LIVE_PRIVATE_SHEET: ${{ vars.IGSV_LIVE_PRIVATE_SHEET }}
      IGSV_LIVE_WEBAPP: ${{ vars.IGSV_LIVE_WEBAPP }}
      IGSV_LIVE_FILES: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tests/e2e/fixtures
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx wp-env start
      - run: npm run test:e2e:live
      - name: Keep the failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-test-results
          path: test-results/
          if-no-files-found: ignore
