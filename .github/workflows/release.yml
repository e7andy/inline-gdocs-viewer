name: Release

# Two ways to release (see "Releasing" in README.md):
#
# - Push a version tag:    git tag v1.2.3 && git push origin v1.2.3
# - Release manually:      Actions > Release > Run workflow, then enter the
#                          version. The tag is created on the chosen branch's
#                          latest commit when the release is published. Tick
#                          "build-only" to test and build the zip without
#                          publishing; the zip is then on the run's page.
#
# Either way, the version must already be set in the code (bin/bump-version.sh),
# the tests must pass, and the built zip must install and work.

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, such as 1.2.3 (must match the version in the code)'
        required: true
      draft:
        description: 'Create the release as a draft (publish it yourself later)'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false
      build-only:
        description: 'Only test and build the zip (download it from the run page); do not publish a release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version like 1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check that the code states this version everywhere
        run: bin/check-version.sh "${{ steps.version.outputs.version }}"
      - name: Check that the changelog has notes for this version
        run: bin/changelog-notes.sh "${{ steps.version.outputs.version }}" > /dev/null
      - name: Check that a manual release doesn't reuse a tag
        if: github.event_name == 'workflow_dispatch' && ! inputs.build-only
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" > /dev/null; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists. Bump the version first (bin/bump-version.sh)."
            exit 1
          fi

  tests:
    name: Tests
    needs: prepare
    uses: ./.github/workflows/tests.yml

  build:
    name: Build and smoke-test the zip
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - run: npm ci
      - name: Build the zip
        id: zip
        run: |
          zip=$(bin/build-zip.sh)
          echo "path=$zip" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$zip")" >> "$GITHUB_OUTPUT"
      - name: Check the zip's contents
        run: bin/verify-zip.sh "${{ steps.zip.outputs.path }}"
      - name: Check PHP syntax in the zip (PHP 7.4)
        run: |
          mkdir -p /tmp/lint && unzip -q "${{ steps.zip.outputs.path }}" -d /tmp/lint
          find /tmp/lint -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Install the zip in WordPress and smoke-test it
        run: KEEP_ENV=1 bin/smoke-test-zip.sh "${{ steps.zip.outputs.path }}"
      # Upload the zip and its checksum as they are (archive: false), so the
      # artifacts download as the installable zip itself, not a zip in a zip.
      # Each artifact is named after its file.
      - name: Upload the zip
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.zip.outputs.path }}
          archive: false
          if-no-files-found: error
      - name: Upload the checksum
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.zip.outputs.path }}.sha256
          archive: false
          if-no-files-found: error
    outputs:
      zip-name: ${{ steps.zip.outputs.name }}

  release:
    name: Publish GitHub release
    needs: [ prepare, tests, build ]
    if: github.event_name == 'push' || ! inputs.build-only
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # skip-decompress keeps the plugin zip as it is instead of unpacking it.
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip-name }}
          path: dist
          skip-decompress: true
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip-name }}.sha256
          path: dist
          skip-decompress: true
      - name: Check the downloaded zip against its checksum
        run: |
          ls -la dist
          cd dist && sha256sum -c "${{ needs.build.outputs.zip-name }}.sha256"
      - name: Write release notes from CHANGELOG.md
        run: bin/changelog-notes.sh "${{ needs.prepare.outputs.version }}" > release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
          ZIP: ${{ needs.build.outputs.zip-name }}
        run: |
          args=( "$TAG" "dist/$ZIP" "dist/$ZIP.sha256"
                 --title "Inline Google Spreadsheet Viewer $VERSION"
                 --notes-file release-notes.md )
          prerelease=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual release: create the tag on the commit that was tested.
            args+=( --target "$GITHUB_SHA" )
            if [ "$DRAFT" = "true" ]; then args+=( --draft ); fi
            prerelease="$PRERELEASE"
          else
            # Tag push: the tag must already exist.
            args+=( --verify-tag )
          fi
          # Versions like 1.2.3-beta.1 are always pre-releases.
          if [ "$prerelease" = "true" ] || [[ "$VERSION" == *-* ]]; then
            args+=( --prerelease )
          fi
          gh release create "${args[@]}"
